<!-- Section Contact -->
<section style="padding:60px 20px; max-width:600px; margin:0 auto;">
  <h2 style="text-align:center; color:#028174; margin-bottom:30px;">Contactez-nous</h2>
  <form>
    <input type="text" placeholder="Nom" required style="width:100%; padding:12px; margin-bottom:15px; border-radius:6px; border:1px solid #ccc;">
    <input type="text" placeholder="Prénom" required style="width:100%; padding:12px; margin-bottom:15px; border-radius:6px; border:1px solid #ccc;">
    <input type="email" placeholder="Email" required style="width:100%; padding:12px; margin-bottom:15px; border-radius:6px; border:1px solid #ccc;">
    <textarea placeholder="Votre message" rows="5" required style="width:100%; padding:12px; margin-bottom:15px; border-radius:6px; border:1px solid #ccc;"></textarea>
    <button type="submit" style="display:block; background:#028174; color:white; padding:12px 20px; border:none; border-radius:8px; cursor:pointer; font-weight:bold; margin:0 auto;">Envoyer</button>
  </form>
</section>
