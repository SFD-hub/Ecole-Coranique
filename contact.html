<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - École Islamique</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* ===== BASE ===== */
    body {
      background: #f5f7fa;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #333;
      margin: 0;
      line-height: 1.6;
    }

    /* ===== HEADER CORRIGÉ ===== */
    header {
      background: linear-gradient(90deg, #028174, #04af9e);
      color: white;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .brand h1 {
      font-size: 1.6rem;
      margin: 0;
      font-weight: bold;
    }

    /* ===== BURGER CORRIGÉ ===== */
    #menu-toggle {
      display: none;
    }

    .burger-btn {
      display: none;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      z-index: 1001;
    }

    .burger-btn span {
      width: 26px;
      height: 3px;
      background: white;
      display: block;
      border-radius: 2px;
      transition: 0.3s;
    }

    /* ===== NAV ===== */
    nav ul {
      list-style: none;
      display: flex;
      gap: 15px;
      margin: 0;
      padding: 0;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 6px;
      transition: background 0.3s, color 0.3s;
    }

    nav a.active,
    nav a:hover {
      background: white;
      color: #028174;
    }

    /* ===== SECTION CONTACT ===== */
    .contact-section {
      padding: 60px 20px;
      max-width: 600px;
      margin: 0 auto;
    }

    .contact-section h2 {
      text-align: center;
      color: #028174;
      margin-bottom: 30px;
      font-size: 2rem;
    }

    .contact-form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .contact-form input,
    .contact-form textarea {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .contact-form button {
      display: block;
      background: #028174;
      color: white;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      margin: 0 auto;
      transition: background 0.3s;
    }

    .contact-form button:hover {
      background: #04af9e;
    }

    /* ===== FOOTER ===== */
    footer {
      background: #028174;
      color: white;
      text-align: center;
      padding: 30px 15px;
      margin-top: 60px;
    }

    footer h3 {
      margin-bottom: 20px;
      font-size: 1.2rem;
      font-weight: 500;
    }

    footer div a {
      margin: 0 12px;
    }

    footer img {
      width: 38px;
      vertical-align: middle;
      border-radius: 50%;
      background: white;
      padding: 6px;
      transition: transform 0.3s;
    }

    footer img:hover {
      transform: scale(1.2);
    }

    footer p {
      margin: 15px 0 0 0;
      font-size: 0.9rem;
      opacity: 0.9;
    }

    /* ===== RESPONSIVE CORRIGÉ ===== */
    @media (max-width: 768px) {
      .burger-btn {
        display: flex;
      }

      nav {
        width: 100%;
        order: 3;
      }

      nav ul {
        flex-direction: column;
        display: none;
        background: linear-gradient(90deg, #028174, #04af9e);
        margin-top: 15px;
        padding: 10px 0;
        max-height: 80vh;
        overflow-y: auto;
        width: 100%;
      }

      #menu-toggle:checked ~ nav ul {
        display: flex;
      }

      nav li {
        width: 100%;
      }

      nav a {
        display: block;
        padding: 12px 20px;
        text-align: center;
      }

      /* Contenu responsive */
      .contact-section {
        padding: 40px 15px;
      }
    }

    @media (min-width: 769px) {
      .burger-btn {
        display: none;
      }
    }
  </style>
</head>

<body>

<!-- ===== HEADER CORRIGÉ ===== -->
<header>
  <div class="brand">
    <h1 class="site-name">École Islamique</h1>
  </div>

  <input type="checkbox" id="menu-toggle">

  <label for="menu-toggle" class="burger-btn">
    <span></span>
    <span></span>
    <span></span>
  </label>

  <nav>
    <ul>
      <li><a href="index.html">Accueil</a></li>
      <li><a href="alquran_wolof.html">Al Qur'an en Wolof</a></li>
      <li><a href="hadith.html">Hadith</a></li>
      <li><a href="dua.html">Dua</a></li>
      <li><a href="apropos.html">À propos</a></li>
      <li><a href="contact.html" class="active">Contact</a></li>
    </ul>
  </nav>
</header>

<!-- ===== SECTION CONTACT ===== -->
<section class="contact-section">
  <h2>Contactez-nous</h2>
  <form class="contact-form">
    <input type="text" placeholder="Nom" required>
    <input type="text" placeholder="Prénom" required>
    <input type="email" placeholder="Email" required>
    <textarea placeholder="Votre message" rows="5" required></textarea>
    <button type="submit">Envoyer</button>
  </form>
</section>

<!-- ===== FOOTER ===== -->
<footer>
  <h3>🌿 Rejoignez-nous sur nos réseaux pour plus de contenu islamique !</h3>
  <div>
    <a href="https://wa.me/221784322880" target="_blank">
      <img src="https://cdn-icons-png.flaticon.com/512/733/733585.png" alt="WhatsApp">
    </a>
    <a href="https://www.tiktok.com/@falloutech" target="_blank">
      <img src="https://cdn-icons-png.flaticon.com/512/3046/3046120.png" alt="TikTok">
    </a>
  </div>
  <p>&copy; 2025 École Islamique. Tous droits réservés.</p>
</footer>

</body>
</html>
